services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rewardloop
      POSTGRES_PASSWORD: local_demo_only
      POSTGRES_DB: rewardloop
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - rewardloop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rewardloop -d rewardloop"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  rewardloop_pg:

