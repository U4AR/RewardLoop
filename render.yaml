# Main reward workspace: one web process, hosted Gemini, real retailer links.
# Configure secrets and review the credit balance before deploying.
services:
  - type: web
    name: rewardloop
    runtime: node
    plan: free
    region: singapore
    autoDeployTrigger: off
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run db:migrate && npm run auth:migrate && npm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: APP_ORIGIN
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: ALLOW_LOCAL_SIGNUP
        value: 'false'
      - key: DEMO_ACCESS_USER
        value: demo
      - key: DEMO_ACCESS_PASSCODE
        sync: false
      - key: ALLOW_FIXTURE_PROVIDERS
        value: 'false'
      - key: CHANNEL3_API_KEY
        sync: false
      - key: KERNEL_API_KEY
        sync: false
      - key: PAYPAL_SANDBOX_CLIENT_ID
        sync: false
      - key: PAYPAL_SANDBOX_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_MERCHANT_ID
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_API_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: VERTEX_PROJECT_ID
        value: gen-lang-client-0907473631
      - key: VERTEX_MODEL
        value: gemini-3.8-flash
      - key: VERTEX_LOCATION
        value: global
      - key: GOOGLE_AUTH_MODE
        value: adc
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/google-credentials.json
# Supply google-credentials.json via Render secret files or workload identity.
# Existing durable PostgreSQL is required; no database is created here.
# Optional legacy sandbox blueprint: render.sandbox.yaml.
